name: Sushi cancel watch

# 실행 하나가 약 5시간 45분 동안 1분마다 확인합니다.
# 실행이 시작되자마자 다음 실행을 직접 대기열에 걸어 두기 때문에, 끝나는 즉시 다음 실행이 이어받습니다.
# (같은 그룹에서는 동시에 하나만 돌고, 대기열에는 하나만 남습니다)
# 15분 간격 예약 실행은 이어달리기가 끊겼을 때를 대비한 보조 장치입니다.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      send_test:
        description: "텔레그램 테스트 메시지 보내기"
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

concurrency:
  group: miyakawa-watch
  cancel-in-progress: false

env:
  WATCH_UNTIL: "2026-12-23"   # 이 날짜(일본 시간)까지만 이어달리기

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4

      - name: Queue next run (relay)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(TZ=Asia/Tokyo date +%F)" \> "$WATCH_UNTIL" ]; then
            echo "감시 기간 종료 — 다음 실행을 예약하지 않습니다."
          else
            gh workflow run watch.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f send_test=false
            echo "다음 실행을 대기열에 걸었습니다."
          fi

      - name: Watch Miyakawa + Kai (every 60s)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MIYAKAWA_DATES: "2026-12-21,2026-12-22,2026-12-23"
          KAI_DATES: "2026-12-21,2026-12-22"
          KAI_PEOPLE: "2"
          INTERVAL_SECONDS: "60"
          LOOP_MINUTES: "345"
          GIT_COMMIT: "true"
          SEND_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.send_test }}
        run: |
          git config user.name "miyakawa-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          python3 monitor.py
