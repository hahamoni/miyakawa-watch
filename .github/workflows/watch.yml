name: Miyakawa cancel watch

# 실행 하나가 약 5시간 50분 동안 1분마다 확인합니다.
# 15분마다 다음 실행을 예약해 두면, 앞 실행이 끝나는 즉시 대기 중이던 실행이 이어받습니다.
# (같은 그룹에서는 동시에 하나만 돌고, 대기열에는 하나만 남습니다)
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      send_test:
        description: "텔레그램 테스트 메시지 보내기"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: miyakawa-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4

      - name: Watch calendar (every 60s)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TARGET_DATES: "2026-12-21,2026-12-22,2026-12-23"
          INTERVAL_SECONDS: "60"
          LOOP_MINUTES: "345"
          GIT_COMMIT: "true"
          SEND_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.send_test }}
        run: |
          git config user.name "miyakawa-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          python3 monitor.py
